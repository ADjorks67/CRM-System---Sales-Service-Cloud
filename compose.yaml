services:
  postgres:
    image: postgres:18-alpine
    container_name: crm-postgres
    restart: unless-stopped
    ports:
      # Host 5433 avoids clashing with a local Windows/Herd Postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_DB: crm_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (not .../data)
      - crm-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: crm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  crm-postgres-data:
